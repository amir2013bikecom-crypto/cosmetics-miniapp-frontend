<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мир Косметики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:#f5f5f5;color:#222}
.header{background:#fff;padding:16px;text-align:center;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:10}
.header h1{font-size:20px;color:#d81b60}
.nav{display:flex;justify-content:center;gap:8px;padding:10px;background:#fff;border-bottom:1px solid #e0e0e0}
.nav button{flex:1;padding:10px;border:none;background:#f8f8f8;border-radius:8px;font-size:14px;cursor:pointer}
.nav button.active{background:#d81b60;color:#fff}
.container{padding:12px;max-width:600px;margin:0 auto}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:12px;font-size:16px}
.categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.cat-btn{white-space:nowrap;padding:8px 14px;border:1px solid #d81b60;background:#fff;color:#d81b60;border-radius:20px;font-size:13px;cursor:pointer}
.cat-btn.active{background:#d81b60;color:#fff}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:relative}
.product-card img{width:100%;height:160px;object-fit:cover}
.product-info{padding:10px}
.product-info h3{font-size:15px;margin-bottom:4px}
.product-info .price{font-size:16px;font-weight:700;color:#d81b60;margin-bottom:6px}
.product-info .rating{font-size:13px;color:#ffa000;margin-bottom:6px}
.product-info button{width:100%;padding:8px;border:none;background:#d81b60;color:#fff;border-radius:8px;font-size:14px;cursor:pointer}
.wish-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.9);border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer}
.cart-item{display:flex;gap:10px;background:#fff;padding:10px;border-radius:10px;margin-bottom:8px;align-items:center}
.cart-item img{width:60px;height:60px;border-radius:8px;object-fit:cover}
.cart-item .info{flex:1}
.cart-item .qty{display:flex;align-items:center;gap:8px}
.cart-item .qty button{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer}
.total-box{background:#fff;padding:14px;border-radius:10px;text-align:center;font-size:18px;font-weight:700;margin-bottom:10px}
.checkout-btn{width:100%;padding:14px;border:none;background:#d81b60;color:#fff;border-radius:10px;font-size:16px;cursor:pointer}
.promo-input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:16px}
.order-card{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px}
.order-card .status{font-size:13px;color:#555;margin-top:4px}
.review-form{background:#fff;padding:12px;border-radius:10px;margin-top:8px}
.review-form textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;resize:vertical;min-height:60px}
.review-form .stars{display:flex;gap:6px;margin:8px 0}
.review-form .stars span{font-size:24px;cursor:pointer}
.review-item{background:#fff;padding:10px;border-radius:10px;margin-bottom:8px}
.review-item .author{font-weight:700;font-size:14px}
.review-item .text{font-size:14px;color:#444;margin-top:4px}
.hidden{display:none}
.empty{text-align:center;color:#888;padding:40px 20px}
</style>
</head>
<body>
<div class="header"><h1>Мир Косметики</h1></div>
<div class="nav">
  <button class="active" onclick="showTab('catalog')">Каталог</button>
  <button onclick="showTab('favorites')">Избранное</button>
  <button onclick="showTab('cart')">Корзина</button>
  <button onclick="showTab('orders')">Заказы</button>
</div>
<div class="container">
  <div id="catalog" class="tab">
    <input type="text" class="search" id="searchInput" placeholder="Поиск товаров..." oninput="filterProducts()">
    <div class="categories" id="categories"></div>
    <div class="products" id="products"></div>
  </div>
  <div id="favorites" class="tab hidden">
    <div id="favoritesList"><div class="empty">Нет избранных товаров</div></div>
  </div>
  <div id="cart" class="tab hidden">
    <div id="cartItems"><div class="empty">Корзина пуста</div></div>
    <div id="cartFooter" class="hidden">
      <input type="text" class="promo-input" id="promoInput" placeholder="Промокод (например SKIDKA10)">
      <button class="checkout-btn" onclick="applyPromo()">Применить промокод</button>
      <div class="total-box" id="cartTotal">Итого: 0 руб.</div>
      <input type="text" class="promo-input" id="addressInput" placeholder="Адрес доставки">
      <input type="text" class="promo-input" id="phoneInput" placeholder="Телефон">
      <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
    </div>
  </div>
  <div id="orders" class="tab hidden">
    <div id="ordersList"><div class="empty">Нет заказов</div></div>
  </div>
</div>
<script>
const API_URL = 'https://cosmetics-marketplace-production.up.railway.app';
let tg = window.Telegram.WebApp;
let userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 1;
let cart = JSON.parse(localStorage.getItem('cart_'+userId) || '[]');
let favorites = JSON.parse(localStorage.getItem('fav_'+userId) || '[]');
let currentCategory = '';
let promoDiscount = 0;
let productsData = [];

tg.expand();
tg.ready();

async function api(path, opts){
  const res = await fetch(API_URL + '/api/v1' + path, opts);
  if(!res.ok) throw new Error('Ошибка сети');
  return res.json();
}

function showTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(id==='catalog') loadProducts();
  if(id==='favorites') loadFavorites();
  if(id==='cart') renderCart();
  if(id==='orders') loadOrders();
}

async function loadCategories(){
  const cats = await api('/categories/');
  let html = '<button class="cat-btn active" onclick="setCategory('')">Все</button>';
  cats.forEach(c=>{
    html += `<button class="cat-btn" onclick="setCategory('${c.slug}')">${c.name}</button>`;
  });
  document.getElementById('categories').innerHTML = html;
}

async function loadProducts(){
  const url = currentCategory ? '/products/?category='+currentCategory : '/products/';
  productsData = await api(url);
  renderProducts(productsData);
}

function renderProducts(list){
  if(!list.length){ document.getElementById('products').innerHTML='<div class="empty">Ничего не найдено</div>'; return; }
  document.getElementById('products').innerHTML = list.map(p=>{
    const isFav = favorites.includes(p.id);
    const stars = '★'.repeat(Math.round(p.rating||0)) + '☆'.repeat(5-Math.round(p.rating||0));
    return `<div class="product-card">
      <button class="wish-btn" onclick="toggleFavorite(${p.id})">${isFav?'❤️':'🤍'}</button>
      <img src="${p.image_url||''}" alt="${p.name}">
      <div class="product-info">
        <h3>${p.name}</h3>
        <div class="price">${p.price} руб.</div>
        <div class="rating">${stars} (${p.reviews_count||0})</div>
        <button onclick="addToCart(${p.id},'${p.name}',${p.price},'${p.image_url||''}')">В корзину</button>
        <button style="margin-top:6px;background:#fff;color:#d81b60;border:1px solid #d81b60" onclick="openReviews(${p.id},'${p.name}')">Отзывы</button>
      </div>
    </div>`;
  }).join('');
}

function setCategory(slug){
  currentCategory = slug;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  loadProducts();
}

function filterProducts(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderProducts(productsData.filter(p=>p.name.toLowerCase().includes(q)));
}

function addToCart(id,name,price,img){
  const ex = cart.find(x=>x.id===id);
  if(ex) ex.qty++; else cart.push({id,name,price,img,qty:1});
  saveCart();
  tg.showAlert('Товар добавлен в корзину');
}

function saveCart(){ localStorage.setItem('cart_'+userId, JSON.stringify(cart)); }

function renderCart(){
  if(!cart.length){ document.getElementById('cartItems').innerHTML='<div class="empty">Корзина пуста</div>'; document.getElementById('cartFooter').classList.add('hidden'); return; }
  let total = 0;
  document.getElementById('cartItems').innerHTML = cart.map((it,i)=>{
    total += it.price * it.qty;
    return `<div class="cart-item">
      <img src="${it.img||''}">
      <div class="info"><div style="font-weight:700">${it.name}</div><div>${it.price} руб.</div></div>
      <div class="qty"><button onclick="changeQty(${i},-1)">-</button><span>${it.qty}</span><button onclick="changeQty(${i},1)">+</button></div>
    </div>`;
  }).join('');
  const finalTotal = Math.max(0, total - (total * promoDiscount / 100));
  document.getElementById('cartTotal').textContent = 'Итого: ' + Math.round(finalTotal) + ' руб.' + (promoDiscount ? ' (скидка '+promoDiscount+'%)' : '');
  document.getElementById('cartFooter').classList.remove('hidden');
}

function changeQty(idx,delta){
  cart[idx].qty += delta;
  if(cart[idx].qty <= 0) cart.splice(idx,1);
  saveCart();
  renderCart();
}

async function applyPromo(){
  const code = document.getElementById('promoInput').value.trim();
  if(!code){ tg.showAlert('Введите промокод'); return; }
  try{
    const res = await api('/promo/validate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code})});
    promoDiscount = res.discount_percent;
    tg.showAlert('Промокод применен! Скидка '+promoDiscount+'%');
    renderCart();
  }catch(e){ tg.showAlert('Промокод не найден'); promoDiscount=0; renderCart(); }
}

async function checkout(){
  if(!cart.length){ tg.showAlert('Корзина пуста'); return; }
  const address = document.getElementById('addressInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  if(!address || !phone){ tg.showAlert('Заполните адрес и телефон'); return; }
  const items = cart.map(c=>({product_id:c.id, quantity:c.qty}));
  try{
    const res = await api('/orders/', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
      buyer_id:userId, buyer_name:(tg.initDataUnsafe.user?tg.initDataUnsafe.user.first_name:'Покупатель'),
      buyer_phone:phone, buyer_address:address, items:items, promo_code:document.getElementById('promoInput').value.trim()
    })});
    tg.showAlert('Заказ оформлен! Номер: '+res.id);
    cart=[]; saveCart(); promoDiscount=0;
    renderCart();
  }catch(e){ tg.showAlert('Ошибка оформления заказа'); }
}

async function loadOrders(){
  try{
    const orders = await api('/orders/'+userId);
    if(!orders.length){ document.getElementById('ordersList').innerHTML='<div class="empty">Нет заказов</div>'; return; }
    document.getElementById('ordersList').innerHTML = orders.map(o=>{
      let st = o.status;
      if(st==='pending') st='Ожидает отправки';
      if(st==='shipped') st='Отправлен';
      if(st==='delivered') st='Доставлен';
      if(st==='cancelled') st='Отменен';
      return `<div class="order-card">
        <div style="font-weight:700">Заказ #${o.id}</div>
        <div>Сумма: ${o.total} руб.</div>
        <div class="status">Статус: ${st}</div>
        <div style="font-size:13px;color:#666;margin-top:4px">${o.items.map(i=>i.product_name+' x'+i.quantity).join(', ')}</div>
        ${o.promo_code?'<div style="font-size:13px;color:#d81b60">Промокод: '+o.promo_code+'</div>':''}
      </div>`;
    }).join('');
  }catch(e){ document.getElementById('ordersList').innerHTML='<div class="empty">Ошибка загрузки</div>'; }
}

function toggleFavorite(pid){
  const idx = favorites.indexOf(pid);
  if(idx>=0) favorites.splice(idx,1); else favorites.push(pid);
  localStorage.setItem('fav_'+userId, JSON.stringify(favorites));
  loadProducts();
}

async function loadFavorites(){
  if(!favorites.length){ document.getElementById('favoritesList').innerHTML='<div class="empty">Нет избранных товаров</div>'; return; }
  const all = await api('/products/');
  const favs = all.filter(p=>favorites.includes(p.id));
  if(!favs.length){ document.getElementById('favoritesList').innerHTML='<div class="empty">Нет избранных товаров</div>'; return; }
  document.getElementById('favoritesList').innerHTML = favs.map(p=>{
    return `<div class="product-card">
      <button class="wish-btn" onclick="toggleFavorite(${p.id})">❤️</button>
      <img src="${p.image_url||''}" alt="${p.name}">
      <div class="product-info">
        <h3>${p.name}</h3>
        <div class="price">${p.price} руб.</div>
        <button onclick="addToCart(${p.id},'${p.name}',${p.price},'${p.image_url||''}')">В корзину</button>
      </div>
    </div>`;
  }).join('');
}

async function openReviews(productId, productName){
  const reviews = await api('/reviews/'+productId);
  let html = `<div style="background:#fff;padding:12px;border-radius:10px;margin-bottom:10px"><h3>Отзывы: ${productName}</h3>`;
  if(!reviews.length) html += '<div style="color:#888;margin-top:8px">Пока нет отзывов</div>';
  else html += reviews.map(r=>`<div class="review-item"><div class="author">${r.buyer_name||'Покупатель'} — ${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><div class="text">${r.text}</div></div>`).join('');
  html += `</div><div class="review-form"><h4>Оставить отзыв</h4><div class="stars" id="starBox"><span onclick="setRating(1)">☆</span><span onclick="setRating(2)">☆</span><span onclick="setRating(3)">☆</span><span onclick="setRating(4)">☆</span><span onclick="setRating(5)">☆</span></div><textarea id="reviewText" placeholder="Ваш отзыв..."></textarea><button class="checkout-btn" style="margin-top:8px" onclick="submitReview(${productId})">Отправить</button></div>`;
  const div = document.createElement('div');
  div.innerHTML = html;
  div.style.position='fixed'; div.style.top='0'; div.style.left='0'; div.style.width='100%'; div.style.height='100%'; div.style.background='#f5f5f5'; div.style.zIndex='100'; div.style.overflow='auto';
  div.innerHTML = '<button style="position:sticky;top:10px;left:10px;z-index:101;padding:8px 14px;border:none;background:#d81b60;color:#fff;border-radius:8px;cursor:pointer" onclick="this.parentElement.remove()">Закрыть</button>' + html;
  document.body.appendChild(div);
}

let selectedRating = 5;
function setRating(n){
  selectedRating = n;
  const box = document.getElementById('starBox');
  if(box) box.innerHTML = [1,2,3,4,5].map(i=>`<span onclick="setRating(${i})">${i<=n?'★':'☆'}</span>`).join('');
}

async function submitReview(productId){
  const text = document.getElementById('reviewText').value.trim();
  if(!text){ tg.showAlert('Введите текст отзыва'); return; }
  try{
    await api('/reviews/', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({product_id:productId, buyer_id:userId, buyer_name:(tg.initDataUnsafe.user?tg.initDataUnsafe.user.first_name:''), rating:selectedRating, text})});
    tg.showAlert('Отзыв добавлен!');
    document.querySelector('button[onclick="this.parentElement.remove()"]').click();
  }catch(e){ tg.showAlert('Ошибка отправки отзыва'); }
}

loadCategories();
loadProducts();
</script>
</body>
</html>
